name: Deploy frontend (demo mode) to GitHub Pages

# Publishes only when a release tag is pushed (e.g. git tag site-v1 && git push origin site-v1)
# or when run by hand, so merges to main never change the live site during the freeze.
on:
  push:
    tags: ['site-v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Contract and scene tests
        run: node --test src/api/*.test.ts src/scenes/*.test.ts
      - name: Build (offline demo mode with precomputed model v2 results)
        run: npm run build
        env:
          VITE_DATA_MODE: demo
          VITE_BASE: /Astral/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
